version: '3'

tasks:
  default:
    cmds:
      - task: install

  check:
    desc: clippy の警告 0 件と fmt を確認する
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings

  build:
    desc: release ビルド
    deps: [check]
    cmds:
      - cargo build --release

  install:
    desc: ビルドして ~/.cargo/bin/prtui を入れ替える
    deps: [build]
    cmds:
      - cargo install --path .
