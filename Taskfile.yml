version: '3'

tasks:
  default:
    cmds:
      - task: install

  check:
    desc: clippy の警告 0 件と fmt を確認する
    cmds:
      - cargo fmt --check
      - cargo clippy --all-targets -- -D warnings

  build:
    desc: release ビルド
    deps: [check]
    cmds:
      - cargo build --release

  install:
    desc: ビルドして ~/.cargo/bin/prtui を入れ替える
    deps: [build]
    cmds:
      - cargo install --path .

  schema:
    desc: GitHub の公開 GraphQL schema を取り直す. クエリの検証は cargo test で行う
    cmds:
      - curl -sSfL https://docs.github.com/public/fpt/schema.docs.graphql -o src/infra/graphql/schema.graphql
